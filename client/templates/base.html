<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}InterviewPilot Agent{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>

<nav class="navbar">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-bold fs-5">
            <i class="bi bi-robot me-2"></i>InterviewPilot Agent
        </span>
        <span class="nav-caption">Document-based Interview Q&amp;A &middot; Groq + FAISS</span>
    </div>
</nav>

<div class="container-fluid px-4 py-4">
{% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/config.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
